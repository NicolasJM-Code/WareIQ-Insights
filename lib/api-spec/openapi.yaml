openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
security:
  - clerkSession: []
paths:
  /webhooks/clerk/{environment}:
    post:
      operationId: ingestClerkRoleEvidence
      summary: Receive signature-verified Clerk role observations
      description: Raw JSON is authenticated by the Svix signature and delivery timestamp, not a browser session. Instance and environment must match server configuration. No historical attempt is reconciled.
      security: []
      parameters:
        - in: path
          name: environment
          required: true
          schema: { type: string, enum: [development, production] }
        - in: header
          name: svix-id
          required: true
          schema: { type: string }
        - in: header
          name: svix-timestamp
          required: true
          schema: { type: string }
        - in: header
          name: svix-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClerkEventEnvelope"
      responses:
        "204":
          description: Evidence stored, duplicate delivery, or event outside the allowlist
        "400":
          description: Invalid signature, stale delivery timestamp, or malformed evidence
        "403":
          description: Environment or instance mismatch
        "413":
          description: Raw payload exceeds the size limit
        "503":
          description: Capture not configured or evidence storage unavailable; retry delivery
  /admin/access-history:
    get:
      operationId: listAccessHistory
      summary: Administrator-only platform role change history
      parameters:
        - in: query
          name: beforeTime
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$' }
        - in: query
          name: beforeId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Durable application database records, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessHistoryPage"
        default:
          $ref: "#/components/responses/AccessFailure"
  /admin/users:
    get:
      operationId: listAccessUsers
      summary: List Clerk accounts for platform administrator approval
      parameters:
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Account page without provider metadata or secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAccessUserPage"
        default:
          $ref: "#/components/responses/AccessFailure"
  /admin/users/{userId}/role:
    patch:
      operationId: changeAccessRole
      summary: Change platform privileges without bypassing client reporting assignments
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformAccessRoleUpdate"
      responses:
        "200":
          description: Updated platform account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAccessUser"
        default:
          $ref: "#/components/responses/AccessFailure"
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Get the verified user's application permissions
      responses:
        "200":
          description: Authenticated identity and server-checked role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /settings/access:
    get:
      operationId: getSettingsAccess
      summary: Check administrator access without returning connection credentials
      responses:
        "200":
          description: Administrator access confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /access/me:
    get:
      operationId: getAccessSession
      security: []
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Current trusted access profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessSession" }
  /access/admin:
    get:
      operationId: getAccessAdmin
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Administrator access directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessDirectory" }
  /access/clients:
    post:
      operationId: saveAccessClient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessClientInput" }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessClient" }
  /access/clients/{clientId}/logo-upload:
    post:
      operationId: requestAccessClientLogoUpload
      summary: Request a private upload URL for a client logo
      parameters:
        - in: path
          name: clientId
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessClientLogoUploadInput" }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Short-lived upload URL and private object path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessClientLogoUpload" }
  /access/clients/{clientId}/logo:
    get:
      operationId: getAccessClientLogo
      summary: Serve a client logo to that client's users
      parameters:
        - in: path
          name: clientId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Client logo image
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
    put:
      operationId: saveAccessClientLogo
      summary: Set or remove a client logo after upload
      parameters:
        - in: path
          name: clientId
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessClientLogoInput" }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Updated client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessClient" }
  /access/warehouses:
    post:
      operationId: saveAccessWarehouse
      summary: Create or update a warehouse within one client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessWarehouseInput" }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Saved warehouse configuration; no WMS records modified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessSite" }
  /access/roles:
    post:
      operationId: saveAccessRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRoleInput" }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRole" }
  /access/users:
    post:
      operationId: saveAccessUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessUserInput" }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessUser" }
  /access/{entity}/{id}:
    delete:
      operationId: deleteAccessEntry
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string, enum: [clients, roles, users] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "204": { description: Deleted }
  /access/own-reports:
    get:
      operationId: listAccessOwnReports
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Definitions owned by the signed-in user in their client
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AccessOwnReport" } }
    post:
      operationId: saveAccessOwnReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessOwnReportInput" }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessOwnReport" }
  /access/own-reports/import:
    post:
      operationId: importAccessOwnReports
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessLegacyReportImportInput" }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: All selected definitions saved as new reports, or none on failure
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AccessOwnReport" } }
  /access/own-reports/{id}:
    delete:
      operationId: deleteAccessOwnReport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "204": { description: Deleted }
  /access/reports/{id}/run:
    post:
      operationId: runAccessReport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRunInput" }
      responses:
        default: { $ref: "#/components/responses/AccessFailure" }
        "200":
          description: Report result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRunResult" }
  /wms/connection/test:
    post:
      operationId: testWmsConnection
      summary: Test a WMS connection without saving credentials or querying warehouse records
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WmsConnectionInput"
      responses:
        "200":
          description: Actual connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WmsConnectionResult"
        "400":
          description: Invalid connection fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WmsError"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WmsError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WmsError"
        "429":
          description: Connection test already running or too frequent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WmsError"
        "503":
          description: Authentication service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WmsError"
  /healthz:
    get:
      operationId: healthCheck
      security: []
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  responses:
    AccessFailure:
      description: Sanitized validation, sign-in, permission, not-found, conflict or service error (400, 401, 403, 404, 409, 503)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AccessProblem" }
    Unauthorized:
      description: Sign-in required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccessError"
    Forbidden:
      description: The account does not have the required role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccessError"
    AuthUnavailable:
      description: Permissions could not be verified; access is denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccessError"
  schemas:
    ClerkEventEnvelope:
      type: object
      description: Opaque provider envelope; authenticate the original bytes before parsing or projecting allowlisted evidence.
      additionalProperties: true
    AccessHistoryEntry:
      type: object
      required: [id, createdAt, finishedAt, actorId, targetId, previousRole, requestedRole, resultingRole, outcome, reason]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string }
        finishedAt: { type: [string, "null"] }
        actorId: { type: string }
        targetId: { type: [string, "null"] }
        previousRole: { type: [string, "null"], enum: [admin, supervisor, unassigned, null] }
        requestedRole: { type: [string, "null"], enum: [admin, supervisor, unassigned, null] }
        resultingRole: { type: [string, "null"], enum: [admin, supervisor, unassigned, null] }
        providerEventId: { type: [string, "null"] }
        providerInstanceId: { type: [string, "null"] }
        providerEnvironment: { type: [string, "null"], enum: [development, production, null] }
        providerOccurredAt: { type: [string, "null"] }
        outcome: { type: string, enum: [succeeded, unchanged, denied, failed, unconfirmed, observed] }
        reason: { type: string }
    AccessHistoryPage:
      type: object
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AccessHistoryEntry"
        nextCursor:
          type: [object, "null"]
          required: [beforeTime, beforeId]
          properties:
            beforeTime: { type: string }
            beforeId: { type: string }
    PlatformAccessRole:
      type: string
      enum: [admin, supervisor, unassigned]
    PlatformAccessRoleUpdate:
      type: object
      additionalProperties: false
      required: [role, expectedRole]
      properties:
        role:
          $ref: "#/components/schemas/PlatformAccessRole"
        expectedRole:
          $ref: "#/components/schemas/PlatformAccessRole"
    PlatformAccessUser:
      type: object
      required: [id, name, email, emailVerified, role, restricted]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        role:
          $ref: "#/components/schemas/PlatformAccessRole"
        restricted: { type: boolean }
        notification: { type: string, enum: [queued, failed, not_needed] }
    PlatformAccessUserPage:
      type: object
      required: [users, total, offset, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/PlatformAccessUser"
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
    AccessError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AuthSession:
      type: object
      required: [userId, role, canReport, canAdminister]
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [admin, supervisor, unassigned]
        canReport:
          type: boolean
        canAdminister:
          type: boolean
    SettingsAccess:
      type: object
      required: [canAdminister]
      properties:
        canAdminister:
          type: boolean
    AccessProblem:
      type: object
      required: [error]
      properties:
        error: { type: string }
    AccessClientInput:
      type: object
      required: [name, companyNumber, addressLine1, addressLine2, city, region, postalCode, country, active]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        companyNumber: { type: string, maxLength: 100 }
        addressLine1: { type: string, maxLength: 200 }
        addressLine2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        region: { type: string, maxLength: 100 }
        postalCode: { type: string, maxLength: 32 }
        country: { type: string, maxLength: 100 }
        active: { type: boolean }
    AccessClient:
      type: object
      required: [id, name, companyNumber, addressLine1, addressLine2, city, region, postalCode, country, logoPath, active]
      properties:
        id: { type: string }
        name: { type: string }
        companyNumber: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string }
        logoPath: { type: [string, "null"] }
        active: { type: boolean }
    AccessClientLogoUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 2097152 }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp] }
    AccessClientLogoUpload:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    AccessClientLogoInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: [string, "null"] }
    AccessWarehouseInput:
      type: object
      required: [clientId, sourceId, name, addressLine1, addressLine2, city, region, postalCode, country, contactPhone, active]
      properties:
        id: { type: string, minLength: 1 }
        clientId: { type: string, minLength: 1 }
        sourceId: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 100 }
        addressLine1: { type: string, maxLength: 200 }
        addressLine2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        region: { type: string, maxLength: 100 }
        postalCode: { type: string, maxLength: 32 }
        country: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 40 }
        active: { type: boolean }
    AccessSite:
      type: object
      required: [id, clientId, sourceId, name, addressLine1, addressLine2, city, region, postalCode, country, contactPhone, active]
      properties:
        id: { type: string }
        clientId: { type: string }
        sourceId: { type: string }
        name: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string }
        contactPhone: { type: string }
        active: { type: boolean }
    AccessRoleInput:
      type: object
      required: [clientId, name, reportIds, canCreateOwnReports]
      properties:
        id: { type: string }
        clientId: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        reportIds: { type: array, uniqueItems: true, items: { type: string }, maxItems: 200 }
        canCreateOwnReports: { type: boolean }
    AccessRole:
      type: object
      required: [id, clientId, name, reportIds, canCreateOwnReports]
      properties:
        notification: { type: string, enum: [queued, failed, not_needed] }
        id: { type: string }
        clientId: { type: string }
        name: { type: string }
        reportIds: { type: array, items: { type: string } }
        canCreateOwnReports: { type: boolean }
    AccessUserInput:
      type: object
      required: [email, name, clientId, roleId, siteIds, primarySiteId, active]
      properties:
        id: { type: string }
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 100 }
        clientId: { type: string }
        roleId: { type: string }
        siteIds: { type: array, uniqueItems: true, maxItems: 100, items: { type: string } }
        primarySiteId: { type: [string, "null"] }
        active: { type: boolean }
    AccessUser:
      type: object
      required: [id, email, name, clientId, roleId, siteIds, primarySiteId, active]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        clientId: { type: string }
        roleId: { type: string }
        siteIds: { type: array, items: { type: string } }
        primarySiteId: { type: [string, "null"] }
        active: { type: boolean }
        notification: { type: string, enum: [queued, failed, not_needed] }
    AccessReport:
      type: object
      required: [id, name, section, sectionName]
      properties:
        id: { type: string }
        name: { type: string }
        section: { type: string }
        sectionName: { type: string }
    AccessDirectory:
      type: object
      required: [clients, sites, roles, users, reports, notificationSummary]
      properties:
        clients: { type: array, items: { $ref: "#/components/schemas/AccessClient" } }
        sites: { type: array, items: { $ref: "#/components/schemas/AccessSite" } }
        roles: { type: array, items: { $ref: "#/components/schemas/AccessRole" } }
        users: { type: array, items: { $ref: "#/components/schemas/AccessUser" } }
        reports: { type: array, items: { $ref: "#/components/schemas/AccessReport" } }
        notificationSummary:
          type: object
          required: [status, queued, retrying, accepted, failed]
          properties:
            status: { type: string, enum: [available, unavailable] }
            queued: { type: integer, minimum: 0 }
            retrying: { type: integer, minimum: 0 }
            accepted: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
    AccessSession:
      type: object
      required: [status, platformAdmin, canCreateOwnReports, reportIds, sites, clientId, clientName, clientCompanyNumber, clientAddressLine1, clientAddressLine2, clientCity, clientRegion, clientPostalCode, clientCountry, clientLogoUrl]
      properties:
        status: { type: string, enum: [signed_out, unassigned, disabled, pending_sites, active] }
        platformAdmin: { type: boolean }
        canCreateOwnReports: { type: boolean }
        clientId: { type: [string, "null"] }
        clientName: { type: [string, "null"] }
        clientCompanyNumber: { type: [string, "null"] }
        clientAddressLine1: { type: [string, "null"] }
        clientAddressLine2: { type: [string, "null"] }
        clientCity: { type: [string, "null"] }
        clientRegion: { type: [string, "null"] }
        clientPostalCode: { type: [string, "null"] }
        clientCountry: { type: [string, "null"] }
        clientLogoUrl: { type: [string, "null"] }
        reportIds: { type: array, items: { type: string } }
        sites: { type: array, items: { $ref: "#/components/schemas/AccessSite" } }
    AccessOwnReportInput:
      type: object
      required: [section, name, description, dataset, fields]
      properties:
        id: { type: string }
        section: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        dataset: { type: string }
        fields: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }
        sourceDefault: { type: string }
    AccessLegacyReportInput:
      type: object
      required: [section, name, description, dataset, fields]
      properties:
        section: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        dataset: { type: string }
        fields: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }
        sourceDefault: { type: string }
    AccessLegacyReportImportInput:
      type: object
      required: [expectedOwnerId, expectedClientId, confirmedOwnership, reports]
      properties:
        expectedOwnerId: { type: string, minLength: 1 }
        expectedClientId: { type: string, minLength: 1 }
        confirmedOwnership: { type: boolean, enum: [true] }
        reports: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/AccessLegacyReportInput" } }
    AccessOwnReport:
      type: object
      required: [id, section, name, description, dataset, fields, createdAt, updatedAt]
      properties:
        id: { type: string }
        section: { type: string }
        name: { type: string }
        description: { type: string }
        dataset: { type: string }
        fields: { type: array, items: { type: string } }
        sourceDefault: { type: string }
        createdAt: { type: string }
